<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devika & Sushant Wedding</title>

     <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&family=Great+Vibes&family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <!-- Entrance Page -->
    <link rel="stylesheet" href="css/entrance.css">

    <!-- Welcome Page -->
    <link rel="stylesheet" href="css/welcomepage.css">
</head>
<body>


    <!-- MUSIC TOGGLE -->

    <button id="musicToggle">
        🔊
    </button>



    <!-- ENTRANCE PAGE -->

    <div id="entry">


        <!-- Entrance Photo -->

        <img src="/photos/entrance.jpg" class="entry-photo" alt="Wedding">


        <!-- Dark Overlay -->

        <div class="entry-photo-overlay"></div>


        <!-- Wedding Logo -->

        <img src="/photos/ds-logo.png" class="entry-logo" alt="Devika and Sushant">


        <!-- Open Invitation -->

        <div class="entry-content">

            <button class="open-btn" onclick="enterSite()">
                Open Invitation
            </button>

        </div>

    </div>



    <!-- WELCOME PAGE -->

    <section id="welcomePage">


        <!-- Soft paper background -->

        <div class="welcome-paper"></div>


        <div class="welcome-layout">


            <!-- LEFT — WEDDING PHOTO -->

            <div class="welcome-photo-side">


                <img src="/photos/welcomepage.JPG" class="main-wedding-photo" alt="Devika and Sushant">


            </div>



            <!-- RIGHT — INVITATION CONTENT -->

            <div class="welcome-content-side">


                <!-- Top-right decorative corner -->

                <div class="corner-line corner-top-right"></div>



                <!-- TOP BOTANICAL DECORATION -->

                <svg class="botanical botanical-top" viewBox="0 0 200 250" aria-hidden="true">

                    <path d="M190 5 C155 35 130 65 110 105 C90 145 72 190 35 245" />

                    <path d="M148 48 C125 45 108 35 94 20" />

                    <path d="M133 70 C153 68 170 60 184 48" />

                    <path d="M116 102 C93 97 76 87 61 72" />

                    <path d="M101 126 C124 125 143 116 158 103" />

                    <path d="M79 163 C59 158 43 148 30 134" />

                    <path d="M64 190 C84 190 101 182 115 169" />


                    <ellipse cx="91" cy="22" rx="9" ry="4" transform="rotate(25 91 22)" />

                    <ellipse cx="174" cy="53" rx="9" ry="4" transform="rotate(-25 174 53)" />

                    <ellipse cx="59" cy="70" rx="10" ry="4" transform="rotate(30 59 70)" />

                    <ellipse cx="149" cy="105" rx="10" ry="4" transform="rotate(-30 149 105)" />

                    <ellipse cx="27" cy="132" rx="10" ry="4" transform="rotate(30 27 132)" />

                </svg>



                <!-- =================================================
                     MAIN INVITATION
                     ================================================= -->

                <div class="welcome-content">


                    <!-- Top ornament -->

                    <div class="top-ornament">

                        <span class="ornament-line"></span>

                        <span class="ornament-symbol"></span>

                        <span class="ornament-line"></span>

                    </div>



                    <!-- Invitation introduction -->

                    <p class="welcome-intro">

                        You are cordially invited

                        <br>

                        to the wedding of

                    </p>



                    <!-- Names -->

                    <h1 class="welcome-names">

                        Devika

                        <span class="ampersand">
                            &amp;
                        </span>

                        Sushant

                    </h1>



                    <!-- Middle ornament -->

                    <div class="middle-ornament">

                        <span class="line"></span>

                        <span class="diamond"></span>

                        <span class="line"></span>

                    </div>



                    <!-- Invitation message -->

                    <p class="welcome-message">

                        Together with our families, we joyfully invite
                        you to celebrate the beginning of our forever.

                    </p>



                    <!-- Wedding date -->

                    <div class="welcome-date">

                        5 December 2026

                    </div>


                </div>



                <!-- =================================================
                     BOTTOM BOTANICAL DECORATION
                     ================================================= -->

                <svg class="botanical botanical-bottom" viewBox="0 0 250 270" aria-hidden="true">

                    <path d="M12 265 C45 230 68 190 92 150 C117 108 145 68 220 20" />

                    <path d="M58 218 C38 214 22 204 10 188" />

                    <path d="M77 187 C100 186 118 177 132 162" />

                    <path d="M99 148 C78 144 62 134 49 119" />

                    <path d="M119 116 C142 116 160 107 174 93" />

                    <path d="M146 78 C127 74 112 65 100 51" />

                    <path d="M170 56 C191 57 207 49 222 35" />


                    <ellipse cx="13" cy="188" rx="12" ry="5" transform="rotate(35 13 188)" />

                    <ellipse cx="132" cy="162" rx="12" ry="5" transform="rotate(-35 132 162)" />

                    <ellipse cx="50" cy="119" rx="12" ry="5" transform="rotate(30 50 119)" />

                    <ellipse cx="173" cy="93" rx="12" ry="5" transform="rotate(-30 173 93)" />

                    <ellipse cx="100" cy="51" rx="11" ry="5" transform="rotate(30 100 51)" />

                    <ellipse cx="221" cy="35" rx="11" ry="5" transform="rotate(-25 221 35)" />

                </svg>



                <!-- Bottom-left decorative corner -->

                <div class="corner-line corner-bottom-left"></div>



                <!-- Small floating botanical details -->

                <span class="floating-leaf leaf-one">
                    ❧
                </span>

                <span class="floating-leaf leaf-two">
                    ❧
                </span>

                <span class="floating-leaf leaf-three">
                    ❧
                </span>


            </div>

        </div>

    </section>



    <!-- =====================================================
         BACKGROUND MUSIC
         ===================================================== -->

    <audio id="bgMusic" loop preload="auto">

        <source src="./song.mp3" type="audio/mpeg">

    </audio>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/entrance.js"></script>


</body>

</html>
