<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devika & Sushant Wedding</title>

     <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- PRELOAD ENTRANCE IMAGE -->
    <link rel="preload" as="image" href="photos/entrance.jpg">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&family=Great+Vibes&family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <!-- Entrance Page -->
    <link rel="stylesheet" href="css/entrance.css">
    <!-- Welcome Page -->
    <link rel="stylesheet" href="css/welcomepage.css">
</head>
<body>
    <!-- MUSIC TOGGLE -->
    <button id="musicToggle">
        🔊
    </button>

    <!-- ENTRANCE PAGE -->
    <div id="entry">

        <!-- Entrance Photo -->
        <img src="photos/entrance.jpg" class="entry-photo" alt="Wedding" fetchpriority="high" decoding="async">
        <!-- Dark Overlay -->
        <div class="entry-photo-overlay"></div>

        <!-- Wedding Logo -->
        <img src="photos/ds-logo.png" class="entry-logo" alt="Devika and Sushant">

        <!-- Open Invitation -->
        <div class="entry-content">

            <button class="open-btn" onclick="enterSite()">
                Open Invitation
            </button>
        </div>
    </div>

    <!-- WELCOME PAGE -->
    <!-- ==================== WELCOME PAGE ==================== -->

<section id="welcomePage">

    <div class="welcome-paper"></div>

    <div class="welcome-layout">

        <!-- LEFT: WEDDING PHOTO -->
        <div class="welcome-photo-side">
        <img src="photos/welcomepage.JPG"
            class="main-wedding-photo"
            alt="Devika and Sushant"
             decoding="async"
        >
        </div>

        <!-- RIGHT: INVITATION -->
        <div class="welcome-content-side">

            <!-- Fine gold corner details -->
            <div class="corner-line corner-top-right"></div>
            <div class="corner-line corner-bottom-left"></div>

            <!-- TOP-RIGHT BOTANICAL BRANCH -->
            <svg class="botanical botanical-top"
                 viewBox="0 0 200 250"
                 aria-hidden="true">

                <g class="branch-drawing">
                    <!-- Main stem -->
                    <path class="branch-stem"
                          d="M195 0 C165 38 145 78 120 118 C98 157 70 198 35 250"/>

                    <!-- Leaves -->
                    <path class="leaf-fill"
                          d="M164 42 C137 42 120 26 112 8 C136 12 155 22 164 42Z"/>

                    <path class="leaf-fill leaf-light"
                          d="M153 58 C175 56 190 43 197 26 C177 31 160 42 153 58Z"/>

                    <path class="leaf-fill"
                          d="M139 82 C112 80 95 63 90 45 C114 51 132 64 139 82Z"/>

                    <path class="leaf-fill leaf-light"
                          d="M128 99 C151 99 169 85 179 68 C156 73 139 84 128 99Z"/>

                    <path class="leaf-fill"
                          d="M109 130 C85 125 72 108 69 91 C91 98 104 111 109 130Z"/>

                    <path class="leaf-fill leaf-light"
                          d="M99 146 C121 145 139 133 150 116 C128 121 111 132 99 146Z"/>

                    <path class="leaf-fill"
                          d="M80 176 C58 170 47 153 45 137 C65 144 77 159 80 176Z"/>

                    <path class="leaf-fill leaf-light"
                          d="M69 192 C90 190 105 177 114 161 C94 167 79 178 69 192Z"/>

                    <!-- Delicate gold seed details -->
                    <path class="branch-accent"
                          d="M175 36 Q183 29 187 19"/>

                    <ellipse class="seed"
                             cx="182" cy="29"
                             rx="2.5" ry="5"
                             transform="rotate(35 182 29)"/>

                    <ellipse class="seed"
                             cx="91" cy="104"
                             rx="2.5" ry="5"
                             transform="rotate(-25 91 104)"/>

                    <ellipse class="seed"
                             cx="54" cy="151"
                             rx="2.5" ry="5"
                             transform="rotate(25 54 151)"/>
                </g>
            </svg>

            <!-- INVITATION TEXT -->
            <div class="welcome-content">

                <div class="top-ornament reveal-item">
                    <span class="ornament-line"></span>
                    <span class="ornament-symbol"></span>
                    <span class="ornament-line"></span>
                </div>

                <p class="welcome-intro reveal-item">
                    You are cordially invited
                    <br>
                    to the wedding of
                </p>

                <h1 class="welcome-names reveal-item">
                    Devika
                    <span class="ampersand">&amp;</span>
                    Sushant
                </h1>

                <div class="middle-ornament reveal-item">
                    <span class="line"></span>
                    <span class="diamond"></span>
                    <span class="line"></span>
                </div>

                <p class="welcome-message reveal-item">
                    Together with our families, we joyfully invite
                    you to celebrate the beginning of our forever.
                </p>

            </div>

            <!-- BOTTOM-LEFT BOTANICAL BRANCH -->
            <svg class="botanical botanical-bottom"
                 viewBox="0 0 250 270"
                 aria-hidden="true">

                <g class="branch-drawing">
                    <path class="branch-stem"
                          d="M0 270 C40 230 67 193 95 153 C124 111 160 66 235 12"/>

                    <path class="leaf-fill"
                          d="M42 229 C19 227 6 211 2 194 C23 201 37 213 42 229Z"/>

                    <path class="leaf-fill leaf-light"
                          d="M53 215 C75 214 91 199 98 181 C77 188 61 200 53 215Z"/>

                    <path class="leaf-fill"
                          d="M75 183 C51 178 39 160 38 143 C59 151 72 165 75 183Z"/>

                    <path class="leaf-fill leaf-light"
                          d="M86 168 C108 166 125 152 135 135 C113 140 97 153 86 168Z"/>

                    <path class="leaf-fill"
                          d="M111 133 C88 127 77 110 77 94 C97 101 109 116 111 133Z"/>

                    <path class="leaf-fill leaf-light"
                          d="M123 117 C144 115 160 100 168 83 C148 89 133 101 123 117Z"/>

                    <path class="leaf-fill"
                          d="M151 83 C130 76 120 60 121 44 C140 52 150 67 151 83Z"/>

                    <path class="leaf-fill leaf-light"
                          d="M163 68 C183 65 199 52 208 36 C188 41 174 53 163 68Z"/>

                    <!-- Fine leaf veins -->
                    <path class="leaf-vein"
                          d="M10 201 Q25 211 38 225
                             M43 222 Q68 210 94 186
                             M45 151 Q61 164 71 178
                             M80 101 Q96 115 106 129
                             M125 51 Q140 65 147 79"/>

                    <!-- Small gold buds -->
                    <ellipse class="seed"
                             cx="27" cy="190"
                             rx="2.5" ry="5"
                             transform="rotate(-25 27 190)"/>

                    <ellipse class="seed"
                             cx="102" cy="146"
                             rx="2.5" ry="5"
                             transform="rotate(25 102 146)"/>

                    <ellipse class="seed"
                             cx="193" cy="42"
                             rx="2.5" ry="5"
                             transform="rotate(35 193 42)"/>
                </g>
            </svg>

        </div>
    </div>
</section>



    <!-- =====================================================
         BACKGROUND MUSIC
         ===================================================== -->

        <audio id="bgMusic" loop preload="none">
            <source src="./song.mp3" type="audio/mpeg">
        </audio>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/entrance.js" defer></script>

</body>

</html>
