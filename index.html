<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devika & Sushant Wedding</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&family=Great+Vibes&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #fdf7f5;
    overflow-x: hidden;

    opacity: 0;
    transition: opacity 0.3s ease;
}
body.loaded {
    opacity: 1;
}
html, body {
    scroll-behavior: smooth;
    overscroll-behavior: none;
}
#entry {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #000;
}

/* ENTRANCE PHOTO */
.entry-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    z-index: 0;
}

/* DARK PHOTO OVERLAY */
.entry-photo-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.48);
    z-index: 1;
    pointer-events: none;
}
.entry-content {
    position: absolute;
    z-index: 2;
    bottom: 70px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    animation: entranceFade 3s ease forwards;
}
.open-btn {
    padding: 13px 32px;
    border: 1px solid rgba(255, 215, 120, 0.75);
    border-radius: 30px;
    background: linear-gradient(
        135deg,
        rgba(255, 236, 170, 0.35),
        rgba(212, 175, 55, 0.22),
        rgba(255, 245, 200, 0.30)
    );
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #fff8dc;
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition:
        background 0.3s ease,
        transform 0.3s ease,
        box-shadow 0.3s ease;
}
.open-btn:hover {
    background: linear-gradient(
        135deg,
        rgba(255, 230, 150, 0.55),
        rgba(212, 175, 55, 0.40),
        rgba(255, 245, 200, 0.50)
    );

    border-color: rgba(255, 225, 140, 0.95);
    transform: translateY(-2px);

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.7),
        0 6px 25px rgba(212,175,55,0.40);
}

.open-btn:active {
    transform: scale(0.97);
}

.entry-logo {
    position: absolute;
    top: 15px;
    left: 50%;
    width: 400px;
    height: 400px;
    object-fit: contain;
    z-index: 3;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.7));

    opacity: 0;
    animation: logoEntrance 3s ease forwards;
}
@keyframes logoEntrance {
    from {
        opacity: 0;
        transform: translate(-50%, -30px);
    }

    to {
        opacity: 1;
        transform: translate(-50%, 0);
    }
}

@keyframes entranceFade {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

#musicToggle {
    display: none;
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.65);
    color: #ffd700;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    z-index: 100000;
}

/* Mobile */
@media (max-width: 768px) {
    #entry {
        background-position: center center;
    }
    .open-btn {
        padding: 12px 28px;
        font-size: 12px;
    }
    .entry-logo {
        top: 50px;
        width: 250px;
        height: 250px;
    }
}
</style>
</head>
<body><button id="musicToggle" >
🔊
</button>
    <div id="entry">
        <!-- ENTRANCE PHOTO -->
    <img src="SHP07393.jpg" class="entry-photo">
    <!-- DARK OVERLAY -->
    <div class="entry-photo-overlay"></div>
    <img src="ds-logo.png" class="entry-logo"> 
    <div class="entry-content">
        <button class="open-btn" onclick="enterSite()">
            Open Invitation
        </button>
    </div>

</div>
<script>
    document.body.classList.add("locked");
    document.documentElement.classList.add("entry-active");
    document.body.classList.add("entry-active");

    // }   

    // music.volume = 0.5;
    // music.play().catch(() => {});
    // document.getElementById("musicToggle").style.display = "flex";

function enterSite() {

    // Hide entrance
    document.getElementById("entry").style.display = "none";

    // Get music
    const music = document.getElementById("bgMusic");

    // Volume
    music.volume = 0.5;

    // Start from beginning for testing
    music.currentTime = 17.5;

    // Play
    music.play()
        .then(() => {
            console.log("Music started successfully");
        })
        .catch((error) => {
            console.error("Music failed:", error);
        });

    // Show music button
    document.getElementById("musicToggle").style.display = "flex";
}

    window.addEventListener("load", () => {
    document.body.classList.add("loaded");
});

document.addEventListener("DOMContentLoaded", () => {

    const toggleBtn = document.getElementById("musicToggle");
    const music = document.getElementById("bgMusic");

    if (!toggleBtn || !music) return;
    toggleBtn.onclick = () => {
        if (music.paused) {
        music.play();
        toggleBtn.innerText = "🔊";
    } else {
        music.pause();
        toggleBtn.innerText = "🔇";
    }

};

    let wasPlaying = false;

    document.addEventListener("visibilitychange", () => {

        if (document.hidden) {
            wasPlaying = !music.paused;
            music.pause();
        } else {
            if (wasPlaying) {
                music.play().catch(() => {});
            }
        }
    });

});
</script>
<audio id="bgMusic" loop preload="auto">
    <source src="./song.mp3" type="audio/mpeg">
</audio>
